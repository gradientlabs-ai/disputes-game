      <div aria-hidden="true" style="width: 40px; height: 40px; background: repeating-linear-gradient(to top, #FF8933 0 12px, transparent 12px 14px); -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 12px, transparent 12px 14px); mask-image: repeating-linear-gradient(90deg, #000 0 12px, transparent 12px 14px)"></div>
